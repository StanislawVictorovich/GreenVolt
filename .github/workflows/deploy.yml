# This workflow is intentionally disabled.
# GitHub Pages for this project should be configured as:
# Settings -> Pages -> Build and deployment -> Source: Deploy from a branch
# Branch: main or master, Folder: /docs
#
# Reason: actions/deploy-pages can get stuck in deployment_queued on some repositories.
# The project ships a prebuilt /docs folder, so GitHub Pages can publish it directly.
name: Disabled Pages Deploy

on:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deployment is disabled. Use GitHub Pages -> Deploy from a branch -> /docs."
